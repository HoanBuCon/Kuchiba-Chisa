name: Verification

on:
  pull_request:
  push:
    branches: [main, HBC]

jobs:
  changed-lines-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/ruff_changed_lines.py
      - name: Full Ruff debt ratchet
        run: python scripts/ruff_debt_ratchet.py

  convention-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Layer contracts (STD-ARC-001, STD-AI-001)
        run: lint-imports
      - name: RAM budget (CON-003, STD-OPS-005)
        run: python scripts/ci/check_ram_budget.py
      - name: Alert runbooks (STD-OBS-004)
        run: python scripts/ci/check_runbooks.py
      - name: Golden set schema (SRS §9)
        run: python -m evals validate
      - name: Conventional Commits (STD-GIT-002)
        if: github.event_name == 'pull_request'
        run: python scripts/ci/check_commit_messages.py
      - name: Dependency vulnerabilities (STD-SEC-006)
        run: pip-audit --requirement requirements.txt --progress-spinner off

  web-client-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run web client tests
        working-directory: frontend
        run: npm test

  discord-bot-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install bot dependencies
        working-directory: discord
        run: npm ci
      - name: Run bot tests
        working-directory: discord
        # The bot config requires these at import and the tests call nothing real. The signing
        # secret is generated per run, so no key-like literal is ever committed.
        env:
          DISCORD_TOKEN: test-placeholder
          DISCORD_CLIENT_ID: "100000000000000000"
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: |
          export CORE_RAG_WORKLOAD_JWT_SECRET="$(openssl rand -hex 32)"
          npm test

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (STD-SEC-002)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  isolated-verification:
    needs: [changed-lines-lint, convention-gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated quality and test gates
        run: docker compose -p kuchiba-chisa-ci -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test
      - name: Remove disposable test infrastructure
        if: always()
        run: docker compose -p kuchiba-chisa-ci -f docker-compose.test.yml down --volumes --remove-orphans
