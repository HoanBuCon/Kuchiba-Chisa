name: Verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changed-lines-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/ruff_changed_lines.py
      - name: Full Ruff debt audit
        run: |
          if python -m ruff check app tests --output-format=concise; then
            exit 0
          else
            audit_status=$?
            if [ "$audit_status" -gt 1 ]; then
              exit "$audit_status"
            fi
            echo "Legacy Ruff debt audit recorded; changed-lines lint is the blocking gate."
          fi

  isolated-verification:
    needs: changed-lines-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated quality and test gates
        run: docker compose -p kuchiba-chisa-ci -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test
      - name: Remove disposable test infrastructure
        if: always()
        run: docker compose -p kuchiba-chisa-ci -f docker-compose.test.yml down --volumes --remove-orphans
