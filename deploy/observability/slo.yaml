apiVersion: openslo/v1
kind: SLO
metadata:
  name: remote-reranker-provider-p95
  annotations:
    srs_requirement: NFR-PERF-006
spec:
  service: chisa-api
  description: Provider HTTP time excludes quota pacing and includes response validation.
  budgetingMethod: Occurrences
  indicator:
    metadata:
      name: remote-reranker-provider-under-750-ms
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(chisa_rag_reranker_duration_seconds_bucket{chisa_stage="provider_http",le="0.75"}[30d]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(chisa_rag_reranker_duration_seconds_count{chisa_stage="provider_http"}[30d]))
  timeWindow:
    - duration: 30d
      isRolling: true
  objectives:
    - displayName: Remote reranker provider HTTP p95 at or below 750 milliseconds
      target: 0.95
