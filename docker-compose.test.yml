name: kuchiba_test

networks:
  test_data:
    driver: bridge

volumes:
  postgres_test_data:
  redis_test_data:
  qdrant_test_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: chisa
      POSTGRES_PASSWORD: chisa_test_secret
      POSTGRES_DB: chisa_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - test_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chisa -d chisa_test"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: "no"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_test_data:/data
    networks:
      - test_data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: "no"
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - qdrant_test_data:/qdrant/storage
    networks:
      - test_data

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    restart: "no"
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://chisa:chisa_test_secret@postgres:5432/chisa_test
      REDIS_URL: redis://redis:6379/15
      CELERY_BROKER_URL: redis://redis:6379/14
      CELERY_RESULT_BACKEND: redis://redis:6379/14
      QDRANT_URL: http://qdrant:6333
      GROQ_API_KEY: test_groq_key_placeholder
      JWT_SECRET: test_jwt_secret_that_is_long_enough_for_validation
      DISCORD_WORKLOAD_JWT_SECRET: test_discord_workload_secret_that_is_long_enough
      SECRET_KEY: test_secret_key_that_is_long_enough_for_validation
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - test_data
    command:
      - /bin/sh
      - -ec
      - >-
        until python -c "from urllib.request import urlopen; urlopen('http://qdrant:6333/healthz', timeout=2)"; do sleep 1; done;
        python -m alembic upgrade head;
        if python -m ruff check app tests --output-format=concise; then :; else ruff_status=$$?; if [ "$$ruff_status" -gt 1 ]; then exit "$$ruff_status"; fi; echo 'Legacy Ruff debt audit recorded; changed-lines lint is the blocking gate.'; fi;
        python -m mypy app;
        python -m pytest tests/unit tests/integration -q
