# Silver cleaning rules (ING-003, ING-012, E3-E5). Bump cleaner_version on any change that alters output.
version: 1
cleaner_version: silver-2
# Elements removed with their whole subtree, by CSS class or tag; the key is the removal reason.
drop:
  ui:
    classes: [navbox, toc, mw-editsection, custom-tabs, mbox, notice, hatnote, toggle-tooltip-icon,
              mw-empty-elt, change-history, description-separator]
    tags: [script, style, noscript, figure, img, audio, hr, annotation]
  media:
    classes: [audio-button, mobile-player-container, wikia-gallery, gallery]
    # Image and file embeds; a missing file renders its raw `File:` name.
    typeof: ["mw:File"]
  external_url:
    # Bare external links (`a.external.free`) whose text is the URL itself.
    classes: [free]
  references:
    classes: [reference, reflist, references-small, cite-bracket]
  cards:
    classes: [card-container, card-list-container, wuwa-iconwcaption-container]
  mobile_duplicate:
    classes: [mobile-only]
# `.hidden` marks desktop/mobile duplicates; these tags hold the desktop copy we keep.
keep_hidden_tags: [th]
# Sections never ingested as text, matched against every heading on the section path.
skip_sections:
  - ^(Gallery|Other Languages|Change History|Navigation|References|Videos|Contents|Glossary)$
  - ^(Character Mentions|Character Voicelines|Quests and Events|Availability|Event Convenes)$
  - ^(Combat|Combat Overview|Ascension Materials|Forte|Resonance Chain|Rewards|Drops|Shop)$
  - ^(Obtained From|Used In|Recipe|Stats|Upgrade|Ascension|Gameplay Notes|Enemies|See Also)$
# Tooltips whose definition is a rendering hint, not a glossary term (E3, E5).
variant_tooltips:
  - ^Text for (male|female) Rover$
  - ^The player's chosen name
# Whole lines dropped as wiki boilerplate (E4).
boilerplate_lines:
  - ^This article is a stub\b
  - ^You can help .* by expanding it
  - ^For other uses, see\b
  - "^Main article:"
  - "^See also:"
  - ^Disclaimer:.*compilation of Skip summary
  - ^Looks like this map doesn't have a page yet
  - ^- (Next|Previous) Page\b
# Wiki-side template bugs that leak markup into rendered text; repaired before the residue check.
repairs:
  - {pattern: '\[\[([^\]|]*)(?:\|[^\]]*)?\]\]', replace: '\1'}
  # A link that lost its opening brackets keeps only its label: "The False Sovereign|figure]]".
  # Page titles are capitalised words, so lower-case words before them are kept.
  - {pattern: '(?:[A-Z][\w''-]* ){0,3}[A-Z][\w''-]*\|([^\]\n]*)\]\]', replace: '\1'}
  - {pattern: '\{\{|\}\}', replace: ''}
  - {pattern: '\bFile:[^\s;]*', replace: ''}
# Markup that must never survive cleaning; any hit quarantines the page (ING-006).
residue_patterns:
  - "\\{\\{|\\}\\}"
  - "\\[\\[|\\]\\]"
  - "\\{\\|"
  - "&nbsp;|&amp;"
  - "https?://"
  - "\\bMedia:|\\bFile:"
  - "\\.ogg\\b"
  - "\\[ ?\\]"
# A (th, td) row whose cell is longer than this is a titled passage, not a fact.
story_min_chars: 80
# Family contracts (design S2): markers present on every page of the family in the 2026-11-02
# calibration; a miss quarantines the page as `layout_changed`.
contracts:
  resonator: {requires_infobox: true, required_kinds: [quote]}
  main_quest: {requires_infobox: true}
  faction: {requires_infobox: true}
  region: {requires_infobox: true}
  voicelines: {required_kinds: [story]}
