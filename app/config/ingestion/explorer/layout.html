<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<style>
body{font:14px/1.5 system-ui,sans-serif;margin:0 auto;max-width:1200px;padding:16px;color:#1c1c1c;background:#fff}
h1{font-size:22px}h2{font-size:17px;margin-top:28px;border-bottom:1px solid #ddd;padding-bottom:4px}
table{border-collapse:collapse;width:100%;margin:8px 0}th,td{border:1px solid #ddd;padding:4px 8px;text-align:left;vertical-align:top}
th{background:#f5f5f5}.fail{color:#b00020;font-weight:600}.pass{color:#0a7d32;font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:8px;max-height:480px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.muted{color:#666}
@media (prefers-color-scheme:dark){body{background:#161616;color:#e6e6e6}th{background:#262626}th,td,h2{border-color:#3a3a3a}
pre{background:#222}.muted{color:#9a9a9a}.fail{color:#ff7a8a}.pass{color:#5fd38a}a{color:#8ab4f8}}
</style>
</head>
<body>{% block body %}{% endblock %}</body>
</html>
