<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chisa AI — Pipeline Visualizer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/visualizer/visualizer.css">
</head>
<body>
    <div id="app-container">
        <!-- ── Header ── -->
        <header>
            <div class="brand">
                <div class="logo-icon">
                    <img src="/assets/dance_chisa.gif" alt="Chisa" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
                </div>
                <span class="logo-text">CHISA<span class="logo-dot">.</span>AI</span>
                <span class="brand-badge">Pipeline Visualizer</span>
            </div>
            
            <div class="status-bar">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span id="ws-status-dot" class="status-dot"></span>
                    <span id="ws-status-text">Connecting...</span>
                </div>
                <button class="btn btn-primary" onclick="ReportExportEngine.exportCurrentTrace()">
                    📥 Xuất Báo Cáo Markdown
                </button>
            </div>
        </header>

        <!-- ── Workspace (3 Columns) ── -->
        <div class="workspace">
            <!-- Column 1: Trace History List -->
            <aside class="panel">
                <div class="panel-header">
                    <span>📜 Lịch sử Traces</span>
                </div>
                <div style="padding: 10px 12px; border-bottom: 1px solid var(--border-color);">
                    <input type="text" id="search-traces" placeholder="Tìm kiếm theo tin nhắn hoặc ID...">
                </div>
                <div class="panel-body" id="trace-list-container">
                    <!-- Loaded dynamically via visualizer.js -->
                </div>
            </aside>

            <!-- Column 2: Pipeline Execution Tree -->
            <section class="panel">
                <div class="panel-header">
                    <span>🌳 Cây Pipeline RAG</span>
                </div>
                <div class="panel-body" id="pipeline-tree-container">
                    <!-- Loaded dynamically via pipeline-tree.js -->
                </div>
            </section>

            <!-- Column 3: Node Inspector Detail Panel -->
            <main class="panel" style="background-color: var(--bg-base);">
                <div class="panel-header">
                    <span>🔍 Chi tiết Node (Inspector)</span>
                </div>
                <div class="panel-body" id="node-inspector-container" style="padding: 0;">
                    <!-- Loaded dynamically via node-inspector.js -->
                </div>
            </main>
        </div>
    </div>

    <!-- ── Modular Scripts ── -->
    <script src="/static/visualizer/visualizer.js"></script>
    <script src="/static/visualizer/pipeline-tree.js"></script>
    <script src="/static/visualizer/node-inspector.js"></script>
    <script src="/static/visualizer/report-export.js"></script>
</body>
</html>
