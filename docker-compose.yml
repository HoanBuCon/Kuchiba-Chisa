# ─────────────────────────────────────────────────────────────────────────────
# Chisa AI — Docker Compose
# Runs all required infrastructure services + the application
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

networks:
  chisa_net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

# ─── Services ─────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chisa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chisa
      POSTGRES_PASSWORD: chisa_secret
      POSTGRES_DB: chisa_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - chisa_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chisa -d chisa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chisa_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - chisa_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: chisa_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    networks:
      - chisa_net

  # ── Chisa API ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: chisa_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://chisa:chisa_secret@postgres:5432/chisa_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      - chisa_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  # ── Celery Worker ───────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: chisa_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://chisa:chisa_secret@postgres:5432/chisa_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
    networks:
      - chisa_net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.infrastructure.queue.worker", "inspect", "ping"]
      interval: 15s
      timeout: 10s
      retries: 3
    command: celery -A app.infrastructure.queue.worker worker --loglevel=info -Q high,medium,low
