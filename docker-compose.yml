# ─────────────────────────────────────────────────────────────────────────────
# Chisa AI — Docker Compose
# Runs all required infrastructure services + the application
# ─────────────────────────────────────────────────────────────────────────────
# Bounded container logs on a single VPS (Docker json-file rotation).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  chisa_edge:
    driver: bridge
    ipam:
      config:
        # Fixed subnet so the API can trust exactly one reverse proxy address
        # (TRUSTED_PROXY_CIDRS=172.28.0.10/32).
        - subnet: 172.28.0.0/24
  chisa_data:
    driver: bridge
    internal: true
  # Egress for the telemetry collector only (SRS v2 §13.2).
  chisa_monitor:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  uploads_data:
  model_cache:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE must reference a provisioned secret file}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:?REDIS_PASSWORD_FILE must reference a provisioned secret file}

# ─── Services ─────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chisa_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: chisa
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: chisa_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - chisa_data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chisa -d chisa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chisa_redis
    restart: unless-stopped
    logging: *default-logging
    command:
      - /bin/sh
      - -ec
      - >-
        printf 'user default off\nuser chisa on >%s ~* +@all\n' "$$(cat /run/secrets/redis_password)" > /run/redis/users.acl;
        exec redis-server --aclfile /run/redis/users.acl --maxmemory 384mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    tmpfs:
      - /run/redis:uid=999,gid=999,mode=0700
    secrets:
      - redis_password
    networks:
      - chisa_data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --user chisa ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: chisa_qdrant
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be supplied by the deployment secret manager}
    networks:
      - chisa_data
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1200M
        reservations:
          memory: 384M

  # ── Chisa API ────────────────────────────────────────────────────
  # ── Inference: the only process that loads models (KNW-007) ────────
  # No egress: the model is provisioned once by `model-warmup` (profile ops).
  inference:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: chisa_inference
    restart: unless-stopped
    logging: *default-logging
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      RERANKER_MODEL: ${INFERENCE_RERANKER_MODEL:-}
      INFERENCE_THREADS: "2"
      FASTEMBED_CACHE_PATH: /app/.cache/fastembed
      HF_HOME: /app/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - model_cache:/app/.cache
    networks:
      - chisa_data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8090/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # e5-small fp32 loads at ~0.82 GB and peaks at 1.07 GB with batch 8
          # (Linux cgroup measurement); INFERENCE_MAX_BATCH must stay at 8 or below.
          memory: 1400M
        reservations:
          memory: 512M
    command: ["python", "-m", "uvicorn", "app.interface.inference.main:app", "--host", "0.0.0.0", "--port", "8090", "--workers", "1", "--no-access-log"]

  model-warmup:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      FASTEMBED_CACHE_PATH: /app/.cache/fastembed
      HF_HOME: /app/.cache/huggingface
    volumes:
      - model_cache:/app/.cache
    # Egress only for the one-time model download.
    networks:
      - chisa_monitor
    command: ["python", "-m", "app.ops.warm_embedding_cache"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: chisa_app
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_USERNAME: chisa
      QDRANT_URL: http://qdrant:6333
      # stdout only; Docker rotates it (B-2: no unbounded backend.log).
      APP_LOG_FILE: ""
      INFERENCE_URL: http://inference:8090
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.28.0.10/32}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Head sampling keeps everything; the collector tail-samples (MON-014).
      OTEL_TRACE_SAMPLE_RATIO: "1.0"
      OTEL_SERVICE_NAME: chisa-api
    secrets:
      - postgres_password
      - redis_password
    volumes:
      # Persistent image memory files (survive redeploys).
      - uploads_data:/app/app/static/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    networks:
      - chisa_edge
      - chisa_data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          # Two uvicorn workers without in-process models (KNW-007).
          memory: 1200M
        reservations:
          memory: 384M
    depends_on:
      inference:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command:
      - /bin/sh
      - -ec
      - >-
        export DATABASE_URL="$$(python -c 'from pathlib import Path; from urllib.parse import quote; print("postgresql+asyncpg://chisa:" + quote(Path("/run/secrets/postgres_password").read_text().strip(), safe="") + "@postgres:5432/chisa_db")')";
        export REDIS_PASSWORD="$$(cat /run/secrets/redis_password)";
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY:-2} --no-access-log

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: chisa_worker
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Head sampling keeps everything; the collector tail-samples (MON-014).
      OTEL_TRACE_SAMPLE_RATIO: "1.0"
      OTEL_SERVICE_NAME: chisa-worker
      REDIS_URL: redis://redis:6379/0
      REDIS_USERNAME: chisa
      QDRANT_URL: http://qdrant:6333
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      APP_LOG_FILE: ""
      INFERENCE_URL: http://inference:8090
    # Longer than WORKER_SHUTDOWN_GRACE_SECONDS (30s) so leases drain cleanly.
    stop_grace_period: 40s
    secrets:
      - postgres_password
      - redis_password
    networks:
      - chisa_data
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # Embeddings come from the inference service (KNW-007).
          memory: 700M
        reservations:
          memory: 256M
    depends_on:
      inference:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command:
      - /bin/sh
      - -ec
      - >-
        export DATABASE_URL="$$(python -c 'from pathlib import Path; from urllib.parse import quote; print("postgresql+asyncpg://chisa:" + quote(Path("/run/secrets/postgres_password").read_text().strip(), safe="") + "@postgres:5432/chisa_db")')";
        export REDIS_PASSWORD="$$(cat /run/secrets/redis_password)";
        exec python -m app.worker

  # ── Discord Bot ──────────────────────────────────────────────────
  discord:
    build:
      context: ./discord
      dockerfile: Dockerfile
    container_name: chisa_discord_bot
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      CORE_RAG_BASE_URL: http://app:8000
      CORE_RAG_CHAT_PATH: /api/v1/chat
      CORE_RAG_CLEAR_PATH_TEMPLATE: /api/v1/chat/clear/{user_id}
    networks:
      - chisa_edge
      - chisa_data
    secrets:
      - postgres_password
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M
        reservations:
          memory: 100M
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    command:
      - /bin/sh
      - -ec
      - >-
        export DATABASE_URL="$$(node -e 'const fs = require("fs"); process.stdout.write("postgresql://chisa:" + encodeURIComponent(fs.readFileSync("/run/secrets/postgres_password", "utf8").trim()) + "@postgres:5432/chisa_db")')";
        exec node src/index.js



  # ── Web edge: Caddy (HTTPS, SPA, /api reverse proxy, SSE) ────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chisa_web
    restart: unless-stopped
    logging: *default-logging
    environment:
      CHISA_DOMAIN: ${CHISA_DOMAIN:?CHISA_DOMAIN must be the public hostname}
      CHISA_ACME_EMAIL: ${CHISA_ACME_EMAIL:?CHISA_ACME_EMAIL must be set for Let's Encrypt}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      chisa_edge:
        ipv4_address: 172.28.0.10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    depends_on:
      app:
        condition: service_started

  # ── One-shot schema migration (run before starting app/worker/discord) ──
  # docker compose --profile ops run --rm migrate
  # ── Monitoring M0 (SRS v2 §13) ──────────────────────────────────
  # Read-only Docker API for container metrics; the collector never mounts the socket (MON-006).
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: chisa_docker_socket_proxy
    restart: unless-stopped
    logging: *default-logging
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - chisa_monitor
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: chisa_otel_collector
    restart: unless-stopped
    logging: *default-logging
    command: ["--config=/etc/otelcol/config.yaml"]
    # Root is required to read host filesystem stats and Docker JSON logs (read-only mounts).
    user: "0:0"
    environment:
      MONITORING_OTLP_ENDPOINT: ${MONITORING_OTLP_ENDPOINT:?MONITORING_OTLP_ENDPOINT must point at the hosted OTLP backend}
      MONITORING_OTLP_AUTHORIZATION: ${MONITORING_OTLP_AUTHORIZATION:?MONITORING_OTLP_AUTHORIZATION must hold the backend auth header}
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - chisa_data
      - chisa_monitor
    depends_on:
      - docker-socket-proxy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 200M

  migrate:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file: .env
    environment:
      APP_LOG_FILE: ""
    secrets:
      - postgres_password
      - redis_password
    networks:
      - chisa_data
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        export DATABASE_URL="$$(python -c 'from pathlib import Path; from urllib.parse import quote; print("postgresql+asyncpg://chisa:" + quote(Path("/run/secrets/postgres_password").read_text().strip(), safe="") + "@postgres:5432/chisa_db")')";
        export REDIS_PASSWORD="$$(cat /run/secrets/redis_password)";
        python -m alembic upgrade head;
        python -m alembic current
