# ─────────────────────────────────────────────────────────────────────────────
# Chisa AI — Docker Compose
# Runs all required infrastructure services + the application
# ─────────────────────────────────────────────────────────────────────────────
networks:
  chisa_edge:
    driver: bridge
  chisa_data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE must reference a provisioned secret file}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:?REDIS_PASSWORD_FILE must reference a provisioned secret file}

# ─── Services ─────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chisa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chisa
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: chisa_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - chisa_data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chisa -d chisa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chisa_redis
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - >-
        printf 'user default off\\nuser chisa on >%s ~* +@all\\n' "$$(cat /run/secrets/redis_password)" > /run/redis/users.acl;
        exec redis-server --aclfile /run/redis/users.acl --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    tmpfs:
      - /run/redis:uid=999,gid=999,mode=0700
    secrets:
      - redis_password
    networks:
      - chisa_data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --user chisa ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: chisa_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be supplied by the deployment secret manager}
    networks:
      - chisa_data
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1200M
        reservations:
          memory: 384M

  # ── Chisa API ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: chisa_app
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_USERNAME: chisa
      QDRANT_URL: http://qdrant:6333
    secrets:
      - postgres_password
      - redis_password
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    networks:
      - chisa_edge
      - chisa_data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command:
      - /bin/sh
      - -ec
      - >-
        export DATABASE_URL="$$(python -c 'from pathlib import Path; from urllib.parse import quote; print("postgresql+asyncpg://chisa:" + quote(Path("/run/secrets/postgres_password").read_text().strip(), safe="") + "@postgres:5432/chisa_db")')";
        export REDIS_PASSWORD="$$(cat /run/secrets/redis_password)";
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY:-2}

  # ── Discord Bot ──────────────────────────────────────────────────
  discord:
    build:
      context: ./discord
      dockerfile: Dockerfile
    container_name: chisa_discord_bot
    restart: unless-stopped
    env_file: .env
    environment:
      CORE_RAG_BASE_URL: http://app:8000
      CORE_RAG_CHAT_PATH: /api/v1/chat
      CORE_RAG_CLEAR_PATH_TEMPLATE: /api/v1/chat/clear/{user_id}
    networks:
      - chisa_edge
      - chisa_data
    secrets:
      - postgres_password
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M
        reservations:
          memory: 100M
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    command:
      - /bin/sh
      - -ec
      - >-
        export DATABASE_URL="$$(node -e 'const fs = require("fs"); process.stdout.write("postgresql://chisa:" + encodeURIComponent(fs.readFileSync("/run/secrets/postgres_password", "utf8").trim()) + "@postgres:5432/chisa_db")')";
        exec node src/index.js


